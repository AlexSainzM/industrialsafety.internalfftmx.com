<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación de inspección | FFT México</title>
  <meta name="description" content="Confirmación de la inspección de Taladro Eléctrico de FFT México.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../../assets/templetes/form_v1/styles.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3 px-md-5 fft-navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="../../../index.html" aria-label="FFT México">
          <img src="../../../assets/img/common/fft_logonormal_headers.webp"
               alt="FFT México"
               height="30"
               class="d-inline-block align-text-top">
        </a>
        <div class="ms-auto">
          <span class="navbar-text text-white fw-medium">
            <i class="bi bi-clipboard-check me-1" aria-hidden="true"></i>
            Taladro Eléctrico
          </span>
        </div>
      </div>
    </nav>
  </header>

  <main class="confirmation-main">
    <section class="container py-5" aria-labelledby="confirmationTitle">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
          <article class="form-section confirmation-card text-center">
            <div id="confirmationIcon" class="confirmation-icon d-none" aria-hidden="true">
              <i class="bi bi-check-lg"></i>
            </div>
            <p class="fft-eyebrow mb-2">02040p54 · Revisión 03</p>
            <h1 id="confirmationTitle" class="display-6 fw-bold mb-3">Confirmación de inspección</h1>
            <p id="confirmationMessage" class="lead text-muted mb-4">No hay una inspección confirmada en esta pestaña.</p>

            <div id="confirmationDetail" class="confirmation-detail text-start d-none" role="note">
              <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
              <p class="mb-0">
                Identificador de la inspección<br>
                <span id="confirmedInspectionId" class="inspection-id-value"></span>
              </p>
            </div>

            <div class="form-actions justify-content-center">
              <a class="btn btn-primary btn-lg" href="../../../index.html">
                <i class="bi bi-arrow-left-circle me-2" aria-hidden="true"></i>Volver al catálogo
              </a>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="fft-footer text-center py-4">
    <div class="container">
      <p class="mb-1">&copy; <span id="currentYear"></span> FFT México. Todos los derechos reservados.</p>
      <p class="mb-0 small">Check List - Taladro Eléctrico · 02040p54 Rev. 03</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
