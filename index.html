<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inspecciones de Seguridad Industrial | FFT México</title>
  <meta name="description" content="Catálogo de inspecciones de Seguridad Industrial de FFT México.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/templetes/form_v1/styles.css">
  <style>
    .catalog-card {
      height: 100%;
      border: 1px solid rgba(87, 87, 86, 0.16);
      border-radius: var(--fft-radius);
      box-shadow: var(--fft-shadow-sm);
      transition: transform var(--fft-transition), box-shadow var(--fft-transition);
    }

    .catalog-card:hover {
      box-shadow: var(--fft-shadow-md);
      transform: translateY(-2px);
    }

    .catalog-card .stretched-link:focus-visible {
      outline: 3px solid var(--fft-green);
      outline-offset: 0.25rem;
    }
  </style>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3 px-md-5 fft-navbar">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="index.html">FFT México</a>
      </div>
    </nav>

    <div class="container pt-5 mt-5">
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <h1 class="display-5 fw-bold mb-4">Inspecciones de Seguridad Industrial</h1>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container pt-4">
      <div class="col-lg-10 mx-auto">
        <div id="sessionError" class="alert alert-danger mb-0" role="alert" hidden></div>
        <noscript>
          <p class="alert alert-warning mb-0">Activa JavaScript para iniciar sesión y abrir los formularios.</p>
        </noscript>
      </div>
    </div>

    <section id="loginSection" class="container py-4" aria-labelledby="loginHeading">
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <form id="loginForm" class="fft-form" method="post">
            <fieldset id="loginFields" class="form-section col-md-8 col-lg-6" disabled>
              <legend id="loginHeading" class="form-section-title float-none w-auto">Iniciar sesión</legend>
              <div class="mb-3">
                <label for="loginUsername" class="form-label">Usuario</label>
                <input id="loginUsername" name="username" class="form-control" type="text"
                       autocomplete="username" autocapitalize="none" spellcheck="false" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Clave</label>
                <input id="loginPassword" name="password" class="form-control" type="password"
                       autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </fieldset>
          </form>
        </div>
      </div>
    </section>

    <section id="catalogSection" class="container py-4" aria-labelledby="catalogHeading" hidden>
      <div class="row">
        <div class="col-lg-10 mx-auto">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <p class="mb-0">Sesión de <strong id="inspectorName"></strong></p>
            <button id="logoutButton" type="button" class="btn btn-outline-secondary">Cerrar sesión</button>
          </div>
          <h2 id="catalogHeading" class="form-section-title" tabindex="-1">Inspecciones disponibles</h2>
          <div class="row g-4 mt-1">
            <div class="col-md-6 col-xl-4">
              <article class="card catalog-card">
                <div class="card-body p-4">
                  <p class="text-muted small mb-2">02040p54 · Rev. 03</p>
                  <h3 class="h4 mb-2">
                    <a class="stretched-link text-decoration-none" href="forms/taladro-electrico/">Taladro Eléctrico</a>
                  </h3>
                  <p class="mb-0 text-muted">Check List para inspeccionar un taladro eléctrico antes de su uso.</p>
                </div>
              </article>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="fft-footer text-center py-4 mt-5">
    <div class="container">
      <p class="mb-0">&copy; <span id="currentYear"></span> FFT México. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/catalog.js"></script>
</body>
</html>
